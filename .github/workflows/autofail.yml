name: Auto-Fail Tasks

on:
  # Run every 15 minutes from 9pm to midnight Egypt time
  # Worker checks autofail_hour setting and only proceeds at the right time
  schedule:
    # Winter (UTC+2): 9pm-midnight Egypt = 7pm-10pm UTC
    - cron: '0,15,30,45 19,20,21,22 * * *'
    # Summer (UTC+3): 9pm-midnight Egypt = 6pm-9pm UTC
    - cron: '0,15,30,45 18,19,20,21 * * *'

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  autofail:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Initialize Auto-Fail
        id: init
        run: |
          echo "🌙 Checking if auto-fail should run..."

          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.AUTOFAIL_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.WORKER_URL }}/api/autofail/init")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          # Handle "not time yet" or "disabled" responses gracefully
          if [ "$http_code" = "400" ]; then
            error=$(echo "$body" | jq -r '.error // "unknown"')
            echo "⏭️ Skipping: $error"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Handle "already running" response
          if [ "$http_code" = "409" ]; then
            echo "⏭️ Auto-fail already running for today"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$http_code" != "200" ]; then
            echo "❌ Initialization failed with status $http_code"
            echo "$body"
            exit 1
          fi

          total_tasks=$(echo "$body" | jq -r '.totalTasks // 0')
          echo "✅ Initialized: $total_tasks tasks queued"
          echo "total_tasks=$total_tasks" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

          if [ "$total_tasks" = "0" ]; then
            echo "No tasks to process - done"
            exit 0
          fi

      - name: Process Tasks in Batches
        if: steps.init.outputs.skip != 'true' && steps.init.outputs.total_tasks != '0'
        run: |
          echo "🔄 Starting batch processing..."

          iteration=0
          max_iterations=40  # 40 * 15s = 10 minutes max

          while [ $iteration -lt $max_iterations ]; do
            iteration=$((iteration + 1))
            echo ""
            echo "📊 Iteration $iteration/$max_iterations"

            response=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.AUTOFAIL_SECRET }}" \
              -H "Content-Type: application/json" \
              "${{ secrets.WORKER_URL }}/api/autofail/process")

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" != "200" ]; then
              echo "❌ Processing failed with status $http_code"
              echo "$body"
              exit 1
            fi

            complete=$(echo "$body" | jq -r '.complete')
            processed=$(echo "$body" | jq -r '.processed // 0')
            total_processed=$(echo "$body" | jq -r '.totalProcessed // 0')
            remaining=$(echo "$body" | jq -r '.remaining // 0')

            echo "Processed this batch: $processed"
            echo "Total processed: $total_processed"
            echo "Remaining: $remaining"

            if [ "$complete" = "true" ]; then
              echo ""
              echo "✅ Auto-fail complete! Processed $total_processed tasks"
              exit 0
            fi

            echo "⏳ Waiting 15 seconds before next batch..."
            sleep 15
          done

          echo ""
          echo "⚠️ Reached maximum iterations ($max_iterations)"
          echo "Processing may be incomplete - check worker logs"
          exit 1

      - name: Cleanup on Failure
        if: failure()
        run: |
          echo "🧹 Attempting cleanup after failure..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.AUTOFAIL_SECRET }}" \
            "${{ secrets.WORKER_URL }}/api/autofail/cleanup" || true
