# ============================================
# Cloudflare Worker Configuration
# WITH DURABLE OBJECTS FOR ASYNC PROCESSING
# ============================================

name = "progress-bot"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Account ID (replace with your Cloudflare account ID)
# You can find this in your Cloudflare Dashboard
# account_id = "064f0f079a1847bc56e1b2f6e021e00b"

# Workers settings
workers_dev = true

# ============================================
# DURABLE OBJECTS CONFIGURATION
# ============================================
# Durable Objects provide isolated, stateful execution
# with NO timeout limits - perfect for long AI processing!

[[durable_objects.bindings]]
name = "REPORT_PROCESSOR"
class_name = "ReportProcessor"
script_name = "progress-bot"

# Migrations (required for Durable Objects)
# Using new_sqlite_classes for free tier compatibility
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReportProcessor"]

# ============================================
# Build configuration
# ============================================
[build]
command = ""

# ============================================
# Development configuration
# ============================================
[env.development]
vars = { ENVIRONMENT = "development" }

# ============================================
# Production configuration
# ============================================
[env.production]
vars = { ENVIRONMENT = "production" }
AUTOFAIL_SECRET = "R3mTq7kV8P1YwFJxZC2H9N0eKQbU6L4aS5oD+MciXg="

# ============================================
# Compatibility settings
# ============================================
compatibility_flags = ["nodejs_compat"]

# ============================================
# Scheduled Tasks (Cron Triggers)
# ============================================
# Auto-coach check-ins run every 30 minutes
[triggers]
crons = ["*/30 * * * *"]

[observability]
[observability.logs]
enabled = false
invocation_logs = true