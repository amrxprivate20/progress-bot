# ============================================
# Cloudflare Worker Configuration
# WITH QUEUES FOR ASYNC PROCESSING
# ============================================

name = "progress-bot"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Account ID (replace with your Cloudflare account ID)
# You can find this in your Cloudflare Dashboard
# account_id = "064f0f079a1847bc56e1b2f6e021e00b"

# Workers settings
workers_dev = true

# Custom domain (optional - configure after deployment)
# routes = [
#   { pattern = "progress.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment variables (for production)
# Use 'wrangler secret put <NAME>' to set these securely
# [vars]
# SUPABASE_URL = "https://xxxxx.supabase.co"
# Note: Don't put actual secrets here, use 'wrangler secret put' command

# ============================================
# QUEUES CONFIGURATION
# ============================================
# Cloudflare Queues for async background jobs
# NO TIMEOUT LIMITS - Perfect for long AI processing!

# Producer binding - allows worker to send messages to queue
[[queues.producers]]
queue = "report-processing-queue"
binding = "REPORT_QUEUE"

# Producer for dead letter queue
[[queues.producers]]
queue = "report-processing-dlq"
binding = "REPORT_DLQ"

# Consumer configuration - processes messages from queue
[[queues.consumers]]
queue = "report-processing-queue"
max_batch_size = 1           # Process 1 message at a time
max_batch_timeout = 30        # Wait max 30s to batch messages
max_retries = 3               # Retry failed messages up to 3 times
dead_letter_queue = "report-processing-dlq"  # Send failed messages here

# ============================================
# Build configuration
# ============================================
[build]
command = ""

# ============================================
# Development configuration
# ============================================
[env.development]
vars = { ENVIRONMENT = "development" }

# ============================================
# Production configuration
# ============================================
[env.production]
vars = { ENVIRONMENT = "production" }

# ============================================
# Compatibility settings
# ============================================
compatibility_flags = ["nodejs_compat"]